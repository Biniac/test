const PRODUCTS = [

const prices=[95000,160000,65000,120000,45000,38000,85000,22000];
const clone = value => JSON.parse(JSON.stringify(value));
function createDataset(){
  const pedidos=Array.from({length:240},(_,i)=>{
    const s=i%4,p=(i*7+Math.floor(i/11))%8;
    return {id_pedido:`N${String(i+1).padStart(4,'0')}`,fecha:`2026-${String(1+Math.floor(i/40)).padStart(2,'0')}-${String(1+i%27).padStart(2,'0')}`,id_tienda:STORES[s].id_tienda,id_producto:PRODUCTS[p].id_producto,cantidad:1+(i*3+s*2)%7,precio_unitario:prices[p],descuento:[0,.05,.1,.15][Math.floor(i/4)%4]};
  });
  // La misma combinación comercial con un identificador distinto ES una venta válida.
  pedidos[2]={...pedidos[1],id_pedido:'N0003'};
  pedidos[12].cantidad=null;
  [20,61,102,143].forEach(i=>{const [y,m,d]=pedidos[i].fecha.split('-');pedidos[i].fecha=`${d}/${m}/${y}`;});
  pedidos[48].cantidad=999;
  pedidos.splice(8,0,clone(pedidos[7]));
  const devoluciones=Array.from({length:22},(_,i)=>({id_devolucion:`D${String(i+1).padStart(3,'0')}`,id_pedido:`N${String(5+i*9).padStart(4,'0')}`,cantidad_devuelta:1,motivo:['Cambio de talla','Defecto','No era lo esperado'][i%3]}));

}
const ORIGINAL=createDataset();
const RECEIPTS={N0013:4,N0049:9};
const METRICS={
  neto:{label:'Ingresos netos',unit:'COP',formula:'Σ cantidad × precio_unitario × (1 − descuento)'},
  bruto:{label:'Ingresos brutos',unit:'COP',formula:'Σ cantidad × precio_unitario'},

};
function normalizeCategory(s){const v=String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return {tecnologia:'Tecnología',hogar:'Hogar',bienestar:'Bienestar',papeleria:'Papelería'}[v]||s;}
function diagnose(data){
  const seen=new Set();let duplicates=0;
  for(const r of data.Pedidos){if(seen.has(r.id_pedido))duplicates++;seen.add(r.id_pedido);}
  return {duplicates,missing:data.Pedidos.filter(r=>r.cantidad===null).length,dates:data.Pedidos.filter(r=>!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)).length,categories:data.Productos.filter(r=>r.categoria!==normalizeCategory(r.categoria)).length,outliers:data.Pedidos.filter(r=>r.cantidad>100).length};
}
const TRANSFORMS={
  duplicates:{title:'Verificar duplicado por ID',description:'Conservar una copia del pedido N0008, idéntico en todos sus campos. N0002 y N0003 se conservan: tienen IDs distintos.',key:'duplicates'},
  missing:{title:'Recuperar el valor faltante',description:'El comprobante sintético de N0013 confirma 4 unidades. Recuperar por ID; no sustituir todos los faltantes por cero.',key:'missing'},
  dates:{title:'Unificar fechas',description:'Las cuatro fechas DD/MM/AAAA se interpretan según la convención documentada del archivo y se convierten a AAAA-MM-DD.',key:'dates'},
  categories:{title:'Normalizar categorías',description:'Aplicar el catálogo aprobado: Tecnología, Hogar, Bienestar y Papelería. Se modifican etiquetas, no ventas.',key:'categories'},
  outliers:{title:'Contrastar el valor atípico',description:'N0049 tiene 999 unidades. El comprobante sintético confirma 9: corregir con evidencia, conservando el registro.',key:'outliers'}
};
function transform(data,type){
  if(!TRANSFORMS[type])throw new Error('Transformación desconocida');
  const next=clone(data),changes=[];
  if(type==='duplicates'){
    const seen=new Map();next.Pedidos=next.Pedidos.filter(r=>{const old=seen.get(r.id_pedido);if(old&&JSON.stringify(old)===JSON.stringify(r)){changes.push({id:r.id_pedido,antes:'2 copias idénticas',despues:'1 copia conservada'});return false;}seen.set(r.id_pedido,r);return true;});
  }
  if(type==='missing'||type==='outliers')for(const r of next.Pedidos){if((type==='missing'&&r.cantidad===null)||(type==='outliers'&&r.cantidad>100)){const n=RECEIPTS[r.id_pedido];if(n!==undefined){changes.push({id:r.id_pedido,antes:r.cantidad??'Vacío',despues:n});r.cantidad=n;}}}
  if(type==='dates')for(const r of next.Pedidos){if(/^\d{2}\/\d{2}\/\d{4}$/.test(r.fecha)){const [d,m,y]=r.fecha.split('/');changes.push({id:r.id_pedido,antes:r.fecha,despues:`${y}-${m}-${d}`});r.fecha=`${y}-${m}-${d}`;}}

}

function calculate(data,{metric='neto',dimension='tienda',operation='suma'}={}){
  const groups=new Map();let excluded=0;
  const returns=new Map();for(const r of data.Devoluciones)returns.set(r.id_pedido,(returns.get(r.id_pedido)||0)+r.cantidad_devuelta);
  for(const r of data.Pedidos){
    if(r.cantidad===null||!Number.isFinite(r.cantidad)||!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)){excluded++;continue;}
    const store=data.Tiendas.find(x=>x.id_tienda===r.id_tienda),prod=data.Productos.find(x=>x.id_producto===r.id_producto);
    const key=dimension==='tienda'?store?.nombre_tienda:dimension==='producto'?prod?.nombre_producto:dimension==='categoria'?prod?.categoria:dimension==='periodo'?r.fecha.slice(0,7):'Total';
    const gross=r.cantidad*r.precio_unitario;
    const value={neto:gross*(1-r.descuento),bruto:gross,descuentos:gross*r.descuento,cantidad:r.cantidad,pedidos:1,devueltas:returns.get(r.id_pedido)||0}[metric];
    const g=groups.get(key)||{label:key||'Sin relación',total:0,count:0};g.total+=value;g.count++;groups.set(key,g);
  }
  const rows=[...groups.values()].map(g=>({...g,value:operation==='conteo'?g.count:operation==='promedio'?g.total/g.count:g.total}));
  rows.sort(dimension==='periodo'?(a,b)=>a.label.localeCompare(b.label):(a,b)=>b.value-a.value);
  return {rows,excluded,records:rows.reduce((a,r)=>a+r.count,0),metric,dimension,operation,formula:operation==='conteo'?'Conteo de registros válidos por grupo':operation==='promedio'?`(${METRICS[metric].formula}) / número de pedidos válidos del grupo`:METRICS[metric].formula};
}

  return '\uFEFF'+[columns.map(cell).join(','),...rows.map(r=>columns.map(k=>cell(r[k])).join(','))].join('\r\n');

function chartSvg(result,options={},data){
  const {type='barras',title='Ingresos netos por tienda',xLabel='',yLabel='',truncated=false}=options;
  const W=760,H=335,L=80,R=24,T=48,B=62,w=W-L-R,h=H-T-B;
  let rows=result.rows;
  if(!rows.length)return '<p class="muted">No hay resultados. Ejecuta una consulta.</p>';
  let points=[];
  if(type==='dispersion'&&data)points=data.Pedidos.filter(r=>r.cantidad!==null&&/^\d{4}-/.test(r.fecha)).map(r=>({x:r.cantidad,y:r.cantidad*r.precio_unitario*(result.metric==='bruto'?1:1-r.descuento),label:r.id_pedido}));
  const max=Math.max(...(points.length?points.map(p=>p.y):rows.map(r=>r.value)),1)*1.15;
  const min=truncated?Math.min(...rows.map(r=>r.value))*.88:0;
  const y=v=>T+h-(v-min)/(max-min)*h;
  const x=i=>L+w*(i+.5)/rows.length;
  const unit=result.operation==='conteo'?'registros':METRICS[result.metric]?.unit||'';
  const axes=Array.from({length:5},(_,i)=>{const v=min+(max-min)*i/4;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#DFE9E7"/><text x="${L-12}" y="${y(v)+4}" text-anchor="end" fill="#587473" font-size="11">${short(v)}</text>`;}).join('');
  let marks='';
  if(type==='dispersion'&&points.length){
    const maxX=Math.max(...points.map(p=>p.x),1)+1;
    marks=points.map(p=>`<circle tabindex="0" class="data-mark" cx="${L+w*p.x/maxX}" cy="${y(p.y)}" r="4" fill="#087F87" opacity=".65"><title>${e(p.label)} · ${p.x} unidades · ${formatNumber(p.y)} COP</title></circle>`).join('');
    marks+=Array.from({length:5},(_,i)=>`<text x="${L+w*i/4}" y="${H-B+24}" text-anchor="middle" fill="#587473" font-size="11">${formatNumber(maxX*i/4,1)}</text>`).join('');
  }else{
    marks=rows.map((r,i)=>`<text x="${x(i)}" y="${H-B+23}" text-anchor="middle" fill="#587473" font-size="11">${e(r.label.length>17?r.label.slice(0,15)+'…':r.label)}</text>`).join('');
    if(type==='lineas')marks+=`<path d="${rows.map((r,i)=>`${i?'L':'M'} ${x(i)},${y(r.value)}`).join(' ')}" fill="none" stroke="#087F87" stroke-width="3"/>`+rows.map((r,i)=>`<circle tabindex="0" class="data-mark" cx="${x(i)}" cy="${y(r.value)}" r="5" fill="#1FF0F0" stroke="#083B42" stroke-width="2"><title>${e(r.label)}: ${formatNumber(r.value)} ${unit}</title></circle>`).join('');
    else marks+=rows.map((r,i)=>`<rect tabindex="0" class="data-mark" x="${x(i)-w/rows.length*.28}" y="${y(r.value)}" width="${w/rows.length*.56}" height="${Math.max(0,y(min)-y(r.value))}" rx="4" fill="${i===0?'#087F87':'#9DD9D5'}"><title>${e(r.label)}: ${formatNumber(r.value)} ${unit}</title></rect><text x="${x(i)}" y="${y(r.value)-9}" text-anchor="middle" fill="#083B42" font-size="11" font-weight="600">${short(r.value)}</text>`).join('');
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${e(title)}. ${e(result.formula)}" viewBox="0 0 ${W} ${H}" style="background:#fff;font-family:Segoe UI,Arial,sans-serif;max-width:100%;height:auto"><title>${e(title)}</title><text x="${L}" y="24" fill="#083B42" font-size="15" font-weight="600">${e(title)}</text><text x="${L}" y="40" fill="#587473" font-size="10">${e(yLabel||unit)}${truncated?' · EJE RECORTADO':''}</text>${axes}${marks}<text x="${L+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#587473">${e(xLabel||(type==='dispersion'?'Unidades por pedido':({tienda:'Tienda',periodo:'Mes',producto:'Producto',categoria:'Categoría'}[result.dimension]||'')))}</text></svg>`;
}

const level=()=>state.completed.length===6?'Analista de datos':state.completed.length>=3?'Explorador de datos':'Analista en formación';
const unlocked=i=>i===0||state.completed.includes(i-1);
const completed=i=>state.completed.includes(i);
const started=i=>getMission(i).step>0||Object.keys(getMission(i).a).length>0;
function skillState(i){if(completed(i))return 'Desbloqueada';const latest=[0,1,2].map(step=>state.attempts.filter(a=>a.mission===i+1&&a.step===step+1).at(-1));return latest.some(a=>a&&!a.success)?'Necesita refuerzo':started(i)?'En práctica':'Por descubrir';}
const field=(label,key,options,value,extra='')=>`<label class="field">${label}<select data-field="${key}" ${extra}>${options.map(([v,t])=>`<option value="${e(v)}" ${String(value??'')===String(v)?'selected':''}>${e(t)}</option>`).join('')}</select></label>`;
function choice(key,value,title,desc,selected){return `<button class="option ${selected===value?'selected':''}" data-action="choice" data-key="${key}" data-value="${e(value)}" aria-pressed="${selected===value}"><span class="radio-dot"></span><span><strong>${title}</strong>${desc?`<small>${desc}</small>`:''}</span></button>`;}
const button=(text,action,kind='secondary',attrs='',ico)=>`<button class="btn ${kind}" data-action="${action}" ${attrs}>${ico?icon(ico,15):''}${text}</button>`;
function feedback(g){return g.feedback?`<div class="feedback ${g.feedback.kind}" role="status">${icon(g.feedback.kind==='good'?'check':'info',18)}<p>${g.feedback.text}</p></div>`:'';}
function setFeedback(i,good,text){const g=getMission(i);g.feedback={kind:good?'good':'bad',text};g.passed[g.step]=good;state.attempts.push({mission:i+1,step:g.step+1,success:good,at:new Date().toISOString()});state.attempts=state.attempts.slice(-200);save();render();}
function invalidate(g){g.passed[g.step]=false;g.feedback=null;}

ados</span></div><div class="coverage">${BLOCKS.map(b=>`<span class="${covered.includes(b)?'covered':''}">${icon(covered.includes(b)?'check':'info',12)} ${b.label}</span>`).join('')}</div>`;}

 return `<h2>Valida lo que conservaste.</h2><p class="lead">La limpieza eliminó solo una copia idéntica. Los comprobantes recuperaron un faltante y corrigieron el atípico. Comprueba los controles antes de cerrar.</p>${qualityTiles()}<div class="mini-stats"><div class="mini-stat"><strong>${ORIGINAL.Pedidos.length}</strong><span>filas originales</span></div><div class="mini-stat"><strong>${state.data.Pedidos.length}</strong><span>filas procesadas</span></div><div class="mini-stat"><strong>${new Set(state.data.Pedidos.map(r=>r.id_pedido)).size}</strong><span>IDs únicos procesados</span></div></div><h3>N0002 y N0003 tienen las mismas medidas, pero IDs diferentes.</h3><div class="options-stack">${choice('repeatPolicy','conservar','Conservar ambos pedidos','Son dos operaciones distintas; coincidir en producto, fecha y cantidad no prueba duplicación.',a.repeatPolicy)}${choice('repeatPolicy','borrar','Borrar uno porque se parecen','Deduplicar solo por las medidas comerciales.',a.repeatPolicy)}</div><p class="note" style="margin-top:17px">Control final de ingresos netos: <strong>${money(calculate(state.data,{dimension:'total'}).rows[0].value)}</strong>. Suma de cantidades: <strong>${num(calculate(state.data,{metric:'cantidad',dimension:'total'}).rows[0].value)}</strong>. No se eliminaron valores por ser extremos sin evidencia.</p>`;

 if(g.step===0){const result=calculate(state.data,queryOf(a));return `<h2>¿Qué tienda genera más ingresos netos?</h2><p class="lead">Construye y ejecuta una consulta. Después selecciona la tienda con el mayor total en la tabla de resultados.</p>${queryControls(queryOf(a))}<p class="note">${METRICS[a.qMetric||'neto'].formula}. Ingresos no equivalen a utilidad.</p>${button('Ejecutar consulta','run-query','','','play')}${a.queryRan?`${resultTable(result,true,a.picked)}<div class="chart-frame">${chartSvg(result,{title:`${METRICS[result.metric].label} por ${result.dimension}`})}</div>`:''}`;}
 if(g.step===1){const claims=[['claim1',`${top.label} tiene los mayores ingresos netos: ${money(top.value)}.`,`La consulta suma ingresos netos de ${top.count} pedidos en esa tienda.`],['claim2',`La ubicación es la causa de que ${top.label} venda más.`,'El dataset describe ventas; no controla tráfico, tamaño de tienda, inversión ni otras causas.'],['claim3',`${bottom.label} y ${top.label} tienen los mismos ingresos netos.`,`${bottom.label}: ${money(bottom.value)}. ${top.label}: ${money(top.value)}.`]];return `<h2>¿Hallazgo, hipótesis o error?</h2><p class="lead">Clasifica cada afirmación según lo que puedes demostrar con la consulta.</p>${claims.map(([k,text,evidence])=>`<div class="claim"><p>${text}</p>${field('Clasificación',k,[['','Selecciona una clasificación'],['hallazgo','Hallazgo respaldado'],['hipotesis','Hipótesis que requiere investigación'],['incorrecta','Conclusión incorrecta']],a[k])}${g.feedback?`<div class="evidence">${icon('search',13)}${evidence}</div>`:''}</div>`).join('')}`;}
 return `<h2>Tu conclusión, con respaldo.</h2><p class="lead">Escribe una observación descriptiva de al menos 40 caracteres y vincúlala a la consulta. Explica también qué no puedes concluir.</p><label class="field">Conclusión<textarea data-input="conclusion" placeholder="La tienda… presenta… Según los datos… Esto no permite afirmar que…">${e(a.conclusion||'')}</textarea></label>${field('Evidencia que adjuntas','source',[['','Selecciona un resultado'],['neto_tienda',`Ingresos netos por tienda · mayor: ${top.label} · ${money(top.value)}`],['sin_evidencia','Una intuición sin resultado calculado']],a.source)}<div class="note">Se valida la longitud y el vínculo explícito a una operación. Esta comprobación estructural no certifica automáticamente la veracidad de todo el texto.</div>${resultTable(truth)}`;

ltar su valor. Eje vertical desde cero.</p>${includeExport?exportButtons():''}`;}

function grade(i){

 if(i===0){
  if(s===0){a.experiment=true;good=!!a.caps?.files&&!!a.caps?.code;text=good?'Ahora sí: el navegador leyó los datos y ejecutó la operación. La cifra es reproducible, pero todavía hay errores en la fuente. Calcular bien no garantiza datos de calidad.':!a.caps?.files?'Sin acceso al archivo, el sistema no conoce los valores. La cifra mostrada es una simulación pedagógica. Activa acceso a archivos y vuelve a experimentar.':'Leer el archivo no ejecuta la operación. Activa ejecución de código para procesar sus registros.';}
  if(s===1){good=a.method==='codigo';text=good?'La agrupación se ejecutó sobre cada fila. Un modelo coordina el trabajo y el razonamiento revisa el plan; una herramienta realiza la operación verificable.':'Ese componente puede organizar o explicar el trabajo, pero no sustituye una operación sobre las filas. Elige un motor que procese los datos.';}
  if(s===2){good=a.proof==='detalle';text=good?'Fuente, fórmula, registros y resultado forman un rastro comprobable. Desbloqueaste una forma de evaluar respuestas de cualquier asistente.':'La confianza y la extensión de una respuesta no demuestran exactitud. Busca evidencia que permita repetir la operación sobre la fuente.';}
 }
 if(i===1){
  if(s===0){const visited=new Set(['Pedidos',...(a.visited||[])]).size;good=a.grain==='pedido'&&visited>=3&&a.inspected;text=good?'Una fila representa un pedido de un producto. Productos y Tiendas aportan atributos; Devoluciones describe eventos vinculados al pedido.':visited<3?'Todavía falta contexto: explora al menos tres hojas para comparar sus columnas y claves.':!a.inspected?'Inspecciona una columna haciendo clic en su nombre. Su tipo no basta: necesitas entender su función.':'El archivo no contiene clientes ni totales mensuales. Revisa cantidad, producto, precio y tienda para reconocer qué describe una fila.';}
  if(s===1){good=a.relStore==='id_tienda'&&a.relProduct==='id_producto'&&a.relReturn==='id_pedido';text=good?'Las claves conservan los vínculos. Pedidos se relaciona muchos a uno con Tiendas y Productos. Las devoluciones se agregan por pedido antes de unir: así no multiplicas las ventas.':'Al menos un vínculo no encuentra sus filas. Relaciona cada identificador con el mismo identificador en la tabla correspondiente; no uses nombres o categorías como claves.';}
  if(s===2){good=a.uniqueness==='verificar';text=good?'La ficha registra las relaciones, las métricas candidatas y la necesidad de validar la unicidad. Tu ambigüedad adicional quedará guardada.':'El nombre del identificador no garantiza unicidad. Hay una copia repetida que debe verificarse; pedidos de un mismo producto pueden ser distintos.';}
 }
 if(i===2){

  if(s===1){good=a.formula==='neto';text=good?'Correcto: el descuento se aplica al importe, no se resta como una cantidad monetaria. La definición excluye devoluciones, impuestos y costos.':'Revisa las unidades. Descuento es una proporción; para aplicarlo al importe debes multiplicar por (1 − descuento).';}
  if(s===2){good=a.ambiguityPolicy==='documentar';text=good?'Una ambigüedad explícita protege la interpretación. La ficha y el prompt se guardarán en tu portafolio para las siguientes misiones.':'Una definición ausente no debe convertirse en un dato inventado. Documenta lo que falta y solicita confirmación antes de ampliar el análisis.';}
 }
 if(i===3){

 if(i===4){

function complete(i){

 const isNew=!completed(i);if(isNew)state.completed.push(i);state.completed.sort((a,b)=>a-b);
 if(i===1)state.artifacts.semantic={...semanticSheet(),ambiguedad_adicional:g.a.ambiguity||''};
 if(i===2){state.artifacts.semantic={...semanticSheet(),ambiguedad_adicional:getMission(1).a.ambiguity||''};state.artifacts.prompt=promptText(g.a);}
 if(i===3)state.artifacts.cleaning=state.transforms.map(({type,changes})=>({procedimiento:TRANSFORMS[type].title,cambios:changes}));
 if(i===4){state.artifacts.analysis=calculate(state.data);state.artifacts.conclusion=g.a.conclusion;}
 if(i===5)state.artifacts.chart=clone(getChart('mission'));

function labAssistant(){const chats=state.chat;return `<h2>Haz una pregunta. Comprueba la operación.</h2><p class="lead">Un asistente para practicar con tus datos, con resultados que puedes reproducir.</p><div class="feedback info" style="margin:0 0 18px">${icon('info',17)}<p><strong>Simulador determinista.</strong> No hay un modelo generativo conectado. Reconoce solicitudes simples y ejecuta funciones de JavaScript sobre NovaRetail.</p></div><div class="recipe-row">${button('Describir el archivo','recipe','secondary sm','data-value="Describe los datos"','table')}${button('Calcular ingresos','recipe','secondary sm','data-value="Calcula los ingresos netos por tienda"','chip')}${button('Crear un gráfico','recipe','secondary sm','data-value="Crea un gráfico de ingresos netos por tienda"','chart')}</div><div class="chat-area" id="chat-area">${chats.length?chats.map(c=>`<div class="chat-msg ${c.role==='user'?'user':''}"><strong>${c.role==='user'?'TÚ':'ASISTENTE · OPERACIÓN VERIFICABLE'}</strong>${e(c.text).replace(/\n/g,'<br>')}${c.result?c.chart?`<div class="chart-frame">${chartSvg(c.result,{title:'Ingresos calculados de NovaRetail'})}</div>`:resultTable(c.result):''}</div>`).join(''):'<div class="chat-msg"><strong>ASISTENTE · SIMULADOR</strong>Puedo describir las cuatro tablas, sumar o promediar ingresos, contar pedidos, analizar unidades y devoluciones, y agrupar por tienda, producto o mes. Empieza con una acción de arriba.</div>'}</div><form id="chat-form" class="chat-input"><input name="message" id="chat-message" aria-label="Mensaje al asistente" placeholder="Ej.: Promedio de ingresos netos por tienda" autocomplete="off" required maxlength="500"><button class="btn" type="submit">Enviar ${icon('arrow',14)}</button></form><p class="note" style="margin-top:12px">Historial guardado localmente · ${state.chat.filter(c=>c.role==='assistant').length} operaciones / respuestas.</p>`;}
function labPage(){if(state.completed.length<6)return lockedPage('lab');const tab=state.lab.tab;return shell(`<div class="page-intro"><div><div class="eyebrow" style="color:#158d7e;margin-bottom:8px">TU ESPACIO PARA EXPERIMENTAR</div><h1>Laboratorio Libre<span style="color:#139a8c">.</span></h1><p>Plantea tus propias preguntas. Las herramientas ya están en tus manos.</p></div><span class="badge">${icon('shield',14)}6 habilidades desbloqueadas</span></div><div class="lab-header"><div class="tabs">${[['explorar','Explorador de datos','table'],['asistente','Asistente analítico','prompt'],['visualizar','Estudio de gráficos','chart']].map(([k,t,ico])=>`<button class="tab ${tab===k?'active':''}" data-action="lab-tab" data-value="${k}">${icon(ico,13)} ${t}</button>`).join('')}</div><a class="card-link" href="#/portafolio">Ver mi portafolio ${icon('arrow',13)}</a></div><section class="workbench">${tab==='explorar'?labExplorer():tab==='asistente'?labAssistant():`<h2>Una nueva mirada a tus datos.</h2><p class="lead">Configura variables, explora sus relaciones y comparte lo que encuentres.</p>${chartWorkbench('lab',true)}${resultTable(calculate(state.data,{metric:getChart('lab').metric,dimension:getChart('lab').dimension}))}`}</section>`, 'laboratorio');}
function portfolio(){const a=state.artifacts,items=[
 ['semantic','table','Ficha semántica','Estructura, relaciones, métricas y ambigüedades del archivo.','ficha'],

 ];return shell(`<div class="page-intro"><div><h1>Tu trabajo cuenta.</h1><p>Cada misión deja algo útil. Aquí tienes la evidencia de lo que has aprendido.</p></div>${button('Descargar portafolio','export-portfolio','','','download')}</div><div class="artifact-grid">${items.map(([key,ico,title,desc,type])=>`<article class="artifact-card"><span class="mission-symbol">${icon(ico,23)}</span><h3>${title}</h3><p>${desc}</p><span class="badge ${a[key]?'':'amber'}">${icon(a[key]?'check':'lock',11)}${a[key]?'Listo para descargar':'Se desbloquea en tu ruta'}</span><div>${button('Descargar','artifact','secondary sm',`data-value="${type}" ${a[key]?'':'disabled'}`,'download')}</div></article>`).join('')}</div><p class="note" style="margin-top:20px">El portafolio completo se descarga como JSON e incluye tablas, transformaciones, intentos y artefactos. Los archivos de cada tarjeta usan formatos de lectura o análisis comunes.</p>`, 'portafolio');}
function guide(){const phases=[['01','Comprender','Inspecciona el archivo, su estructura y lo que significa cada fila. Un identificador candidato necesita validación.'],['02','Preparar','Diagnostica antes de limpiar. Conserva el original, compara el cambio y registra su evidencia.'],['03','Analizar','Define la métrica, la agrupación y la operación. Comprueba cuántos registros entran en el cálculo.'],['04','Concluir','Separa hallazgos, hipótesis y errores. Un patrón observado no demuestra una relación causal.'],['05','Visualizar','Haz visible la pregunta. Compara categorías con barras y evolución temporal con líneas. Explora también durante el análisis.'],['06','Entregar','Ajusta la entrega a su destinatario y facilita su verificación. Exporta datos, gráficos y contexto.']];const glossary=[['Modelo de lenguaje','Interpreta instrucciones, genera lenguaje y coordina tareas. Una respuesta plausible no demuestra que haya leído o calculado un archivo.'],['Razonamiento','Ayuda a planear, descomponer, comprobar y revisar. No garantiza por sí mismo exactitud matemática.'],['Herramientas','Ejecutan operaciones verificables: leer tablas, transformar valores, calcular y visualizar. En esta experiencia las operaciones se ejecutan en JavaScript.'],['Conectores','Dan acceso a aplicaciones y fuentes externas con permisos específicos. No sustituyen la definición de métricas ni los controles de calidad.'],['Agentes de código','Trabajan con archivos y programas; pueden reutilizar procedimientos. Su acceso y las operaciones ejecutadas deben poder inspeccionarse.'],['Transferir lo aprendido','En ChatGPT, Gemini, Claude, Copilot, Excel o un agente de código, pide contexto, definiciones, operaciones, registros utilizados y controles. Confirma qué herramientas tiene disponible cada entorno.']];return shell(`<div class="page-intro"><div><h1>Una guía para volver a preguntar.</h1><p>Conceptos breves, útiles en cualquier herramienta de análisis con IA.</p></div></div><div class="guide-grid">${phases.map(([n,t,d])=>`<article class="guide-card"><div class="eyebrow">EL MÉTODO · ${n}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div><section class="workbench glossary" style="margin-top:24px"><h2>¿Qué hace cada pieza del sistema?</h2>${glossary.map(([t,d])=>`<details><summary>${t}</summary><p>${d}</p></details>`).join('')}</section><div class="workbench" style="margin-top:20px"><h3>Las definiciones de NovaRetail</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Métrica</th><th>Operación</th><th>Unidad</th></tr></thead><tbody>${Object.values(METRICS).map(m=>`<tr><td>${m.label}</td><td>${e(m.formula)}</td><td>${m.unit}</td></tr>`).join('')}</tbody></table></div><p class="note">Datos ficticios de enero a junio de 2026. Ingresos netos descuenta promociones; no descuenta devoluciones, impuestos ni costos. Todos los importes están en COP.</p></div>`, 'guia');}

function render(){
 const r=route();let html;
 if(r[0]==='mision'){const i=Number(r[1])-1;html=Number.isInteger(i)&&i>=0&&i<6?missionPage(i):dashboard();}
 else if(r[0]==='logro'){const i=Number(r[1])-1;html=completed(i)?completionPage(i):dashboard();}
 else if(r[0]==='laboratorio')html=labPage();
 else if(r[0]==='portafolio')html=portfolio();
 else if(r[0]==='guia')html=guide();
 else html=dashboard();
 document.getElementById('app').innerHTML=html;document.title=`Data Fácil con IA · ${r[0]==='mision'?'Misión '+r[1]:r[0]==='laboratorio'?'Laboratorio Libre':'Aprende haciendo'}`;
 if(r[0]==='laboratorio'&&state.lab.tab==='asistente'){const area=document.getElementById('chat-area');if(area)area.scrollTop=area.scrollHeight;}
}
function currentMission(){const r=route();return r[0]==='mision'?Number(r[1])-1:null;}
function download(name,content,type='text/plain;charset=utf-8'){
 const url=URL.createObjectURL(new Blob([content],{type})),anchor=document.createElement('a');anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Archivo generado: '+name);
}
function downloadChart(type,portfolioMode=false){
 const scope=route()[0]==='laboratorio'?'lab':'mission',c=portfolioMode?(state.artifacts.chart||getChart('mission')):getChart(scope),r=calculate(state.data,{metric:c.metric,dimension:c.dimension});
 if(type==='svg')download('novaretail-grafico.svg',chartSvg(r,c,state.data),'image/svg+xml;charset=utf-8');
 if(type==='html')download('novaretail-interactivo.html',standaloneHTML(state.data,c),'text/html;charset=utf-8');
 if(type==='csv'){const rows=c.type==='dispersion'?state.data.Pedidos.map(p=>({id_pedido:p.id_pedido,cantidad:p.cantidad,ingreso:p.cantidad*p.precio_unitario*(c.metric==='bruto'?1:1-p.descuento)})):r.rows.map(x=>({grupo:x.label,metrica:METRICS[c.metric].label,valor:x.value,unidad:METRICS[c.metric].unit,pedidos:x.count}));download('novaretail-datos-grafico.csv',csv(rows),'text/csv;charset=utf-8');}
 if(scope==='mission'&&!portfolioMode){const g=getMission(5);g.a.downloads=[...new Set([...(g.a.downloads||[]),type])];save();if(currentMission()===5)render();}
}

 const a=state.artifacts;

 if(type==='limpieza')download('novaretail-transformaciones.csv',csv(state.transforms.flatMap(l=>l.changes.map(c=>({procedimiento:TRANSFORMS[l.type].title,...c})))),'text/csv;charset=utf-8');
 if(type==='dataset')download('novaretail-pedidos-limpios.csv',csv(state.data.Pedidos),'text/csv;charset=utf-8');

function chat(message){
 const text=message.trim().slice(0,500);if(!text)return;
 state.chat.push({role:'user',text});const t=text.toLowerCase();let reply;
 if(/describ|hoja|estructura|archivo|columna/.test(t))reply={text:`NovaRetail tiene ${state.data.Pedidos.length} pedidos, ${state.data.Productos.length} productos, ${state.data.Tiendas.length} tiendas y ${state.data.Devoluciones.length} devoluciones. Un registro de Pedidos representa un pedido de un producto. Las claves son id_pedido, id_tienda e id_producto. Moneda: COP. Período: enero a junio de 2026. Calidad: ${totalIssues(state.data)} señales pendientes. Ingresos netos no resta devoluciones, impuestos ni costos.`};
 else if(/ingreso|venta|neto|bruto|unidad|cantidad|promedio|cuenta|conteo|pedido|gr[aá]fic|devol/.test(t)){
  const metric=/devol/.test(t)?'devueltas':/unidad|cantidad/.test(t)?'cantidad':/cuenta|conteo|pedidos/.test(t)?'pedidos':/bruto/.test(t)?'bruto':'neto',dimension=/producto/.test(t)?'producto':/mes|per[ií]odo/.test(t)?'periodo':'tienda',operation=/promedio/.test(t)?'promedio':/cuenta|conteo/.test(t)?'conteo':'suma',r=calculate(state.data,{metric,dimension,operation});
  reply={text:`Operación ejecutada: ${operation} de ${METRICS[metric].label.toLowerCase()} por ${dimension}. Fuente: versión procesada de Pedidos. ${r.records} registros utilizados; ${r.excluded} excluidos. Fórmula: ${r.formula}. No se generó una explicación causal.`,result:r,chart:/gr[aá]fic/.test(t)};
 }else reply={text:'Esta solicitud no coincide con una operación disponible. Puedes pedir «Describe los datos», «Suma ingresos netos por tienda», «Promedio de ingresos por producto», «Cuenta pedidos por mes», «Unidades devueltas por tienda» o «Crea un gráfico». No se ejecuta código escrito por el usuario.'};
 state.chat.push({role:'assistant',...reply,at:new Date().toISOString()});state.chat=state.chat.slice(-40);save();render();document.getElementById('chat-message')?.focus();
}

document.addEventListener('click',event=>{
 if(event.target.closest('a.skip-link')){event.preventDefault();document.getElementById('main')?.focus();return;}
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,i=currentMission(),g=i!==null&&i>=0&&i<6?getMission(i):null,a=g?.a;
 if(action==='home')go('ruta');
 else if(action==='check'&&g)grade(i);
 else if(action==='next'&&g&&g.passed[g.step]){if(g.step===2)complete(i);else{g.step++;g.feedback=null;save();render();document.querySelector('.workbench')?.scrollIntoView({block:'start',behavior:'smooth'});}}
 else if(action==='previous'&&g&&g.step>0){g.step--;g.feedback=null;save();render();}

 else if(action==='toggle-cap'&&g){a.caps??={};a.caps[el.dataset.key]=!a.caps[el.dataset.key];a.experiment=false;invalidate(g);save();render();}
 else if(action==='sheet'&&g){a.sheet=el.dataset.value;a.visited=[...new Set([...(a.visited||[]),el.dataset.value])];a.column='';save();render();}
 else if(action==='column'&&g){a.column=el.dataset.value;a.inspected=true;save();render();}
 else if(action==='prompt-mode'&&g){a.mode=el.dataset.value;invalidate(g);save();render();}
 else if(action==='add-block'&&g){a.blocks=[...(a.blocks||[]),el.dataset.value];invalidate(g);save();render();}
 else if(action==='remove-block'&&g){a.blocks.splice(Number(el.dataset.index),1);invalidate(g);save();render();}
 else if(action==='move-block'&&g){const j=Number(el.dataset.index),k=j+Number(el.dataset.delta);if(k>=0&&k<a.blocks.length)[a.blocks[j],a.blocks[k]]=[a.blocks[k],a.blocks[j]];invalidate(g);save();render();}
 else if(action==='apply-transform'&&g){const type=a.transform||'duplicates',result=transform(state.data,type);if(result.changes.length){state.transforms.push({type,changes:result.changes,before:clone(state.data)});state.data=result.data;const next=Object.keys(TRANSFORMS).find(k=>diagnose(state.data)[k]>0);if(next)a.transform=next;invalidate(g);save();render();toast('Transformación aplicada. La fuente original se conserva.');}}
 else if(action==='undo-transform'&&g&&state.transforms.length){const last=state.transforms.pop();state.data=last.before;a.transform=last.type;invalidate(g);save();render();toast('Cambio deshecho. Puedes volver a aplicarlo.');}
 else if(action==='run-query'&&g){a.queryRan=true;a.picked='';invalidate(g);save();render();}
 else if(action==='pick-result'&&g){a.picked=el.dataset.value;invalidate(g);save();render();}
 else if(action.startsWith('export-')&&['export-svg','export-html','export-csv'].includes(action))downloadChart(action.split('-')[1]);
 else if(action==='lab-tab'){state.lab.tab=el.dataset.value;save();render();}
 else if(action==='search-data'){state.lab.page=0;save();render();}
 else if(action==='table-prev'){state.lab.page=Math.max(0,state.lab.page-1);save();render();}
 else if(action==='table-next'){state.lab.page++;save();render();}
 else if(action==='export-sheet'){const data=state.lab.source==='original'?ORIGINAL:state.data;download(`novaretail-${state.lab.sheet.toLowerCase()}-${state.lab.source}.csv`,csv(data[state.lab.sheet]),'text/csv;charset=utf-8');}
 else if(action==='recipe')chat(el.dataset.value);
 else if(action==='artifact')artifact(el.dataset.value);
 else if(action==='export-portfolio')download('data-facil-con-ia-portafolio.json',JSON.stringify({aplicacion:'Data Fácil con IA',exportado:new Date().toISOString(),...state},null,2),'application/json');
 else if(action==='replay'){event.preventDefault();const id=Number(el.dataset.id);const old=getMission(id);old.step=0;old.passed=[false,false,false];old.feedback=null;save();go('mision/'+(id+1));}
 else if(['help','about','profile'].includes(action))showDialog(action);
 else if(action==='close-dialog')document.getElementById('dialog').close();
 else if(action==='save-name'){const n=document.getElementById('profile-name').value.trim();state.name=n.slice(0,30)||'Analista';save();document.getElementById('dialog').close();render();toast('Tu nombre quedó guardado.');}
 else if(action==='reset-confirm')showDialog('reset');
 else if(action==='reset-now'){state=initial();save();document.getElementById('dialog').close();go('ruta');toast('Progreso reiniciado. Un nuevo capítulo empieza.');}
});
document.addEventListener('input',event=>{
 const el=event.target,i=currentMission(),g=i!==null?getMission(i):null;
 if(el.dataset.input&&g){g.a[el.dataset.input]=el.value;invalidate(g);save();const next=document.querySelector('[data-action="next"]');if(next)next.disabled=true;
  if(i===2&&g.step===0&&g.a.mode==='free'){const covered=coverage(g.a);const box=document.querySelector('.coverage');if(box)box.innerHTML=BLOCKS.map(b=>`<span class="${covered.includes(b)?'covered':''}">${icon(covered.includes(b)?'check':'info',12)} ${b.label}</span>`).join('');const n=document.querySelector('.section-heading>span');if(n)n.textContent=covered.length+'/7 identificados';}
 }
 if(el.dataset.labInput){state.lab[el.dataset.labInput]=el.value;save();}
 if(el.dataset.chartInput){const c=getChart(route()[0]==='laboratorio'?'lab':'mission');c[el.dataset.chartInput]=el.value;if(el.dataset.chartInput==='title')c.customTitle=true;if(g){invalidate(g);const next=document.querySelector('[data-action="next"]');if(next)next.disabled=true;}save();const frame=document.getElementById('live-chart');if(frame)frame.innerHTML=chartSvg(calculate(state.data,{metric:c.metric,dimension:c.dimension}),c,state.data);}
});
document.addEventListener('change',event=>{
 const el=event.target,i=currentMission(),g=i!==null?getMission(i):null;
 if(el.dataset.field){const key=el.dataset.field;if(key==='labSource'){state.lab.source=el.value;state.lab.page=0;}else if(key==='labSheet'){state.lab.sheet=el.value;state.lab.page=0;state.lab.search='';}else if(g){g.a[key]=el.value;if(['qMetric','qDimension','qOperation'].includes(key))g.a.queryRan=false;invalidate(g);}save();render();}
 if(el.dataset.chart){const c=getChart(route()[0]==='laboratorio'?'lab':'mission');c[el.dataset.chart]=el.value;if(c.type==='dispersion'&&!['neto','bruto'].includes(c.metric))c.metric='neto';if(!c.customTitle)c.title=autoChartTitle(c);if(g){g.a.chartTotal='';invalidate(g);}save();render();}
});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.dataset.labInput==='search'){event.preventDefault();state.lab.page=0;save();render();}});
document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();chat(document.getElementById('chat-message').value);}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('storage',event=>{if(event.key===KEY)toast('El progreso cambió en otra pestaña. Recarga para ver la última versión.');});
render();
</script>
</body>
</html>
